
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Ficha de Academia Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ficha de Treino 💪</h1>
            <p>Gerenciamento de treinos e exercícios</p>
        </header>

        <div class="gerenciador-abas">
            <div id="abas-treinos" class="menu-treinos"></div>

            <div class="acoes-treino">
                <button type="button" id="btn-novo-treino" class="btn-acao">
                    + Novo Treino
                </button>
                <button type="button" id="btn-excluir-treino" class="btn-acao btn-perigo">
                    - Excluir Treino
                </button>
            </div>
        </div>

        <main>
            <h2 id="titulo-treino">Carregando treinos...</h2>

            <ul id="lista-exercicios" class="lista"></ul>

            <form id="form-exercicio">
                <input
                    type="text"
                    id="novo-exercicio"
                    placeholder="Exercício (ex: Supino)"
                    required
                >

                <input
                    type="text"
                    id="detalhes-exercicio"
                    placeholder="Séries x repetições (ex: 4x12)"
                    required
                >

                <button type="submit" class="btn-add">
                    Adicionar Exercício
                </button>
            </form>

            <p id="mensagem-status" role="status" aria-live="polite"></p>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
